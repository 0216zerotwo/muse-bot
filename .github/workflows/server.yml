name: Server & Deploy

# Backend plugin tests (companion/), deploy CLI/script tests (deploy/), tool syntax checks,
# iOS & Android static project validation, and a release-bundle dry run.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-deploy:
    name: Deploy CLI & static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0, node24
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: 22
      - name: Shell, Node, and Python syntax checks
        run: |
          set -euo pipefail
          for f in deploy/vps/*.sh tools/*.sh android/build.sh; do
            bash -n "$f"
          done
          node --check deploy/npm/bin/musebot.js
          python3 -m py_compile \
            tools/companion-pair.py \
            tools/companion_api_probe.py \
            tools/companion_ws_probe.py \
            tools/draw_icons.py \
            tools/make_app_icons.py \
            tools/icon-runs/contact_sheet.py \
            ios/scripts/validate.py \
            android/scripts/validate.py
      - name: Validate iOS & Android project and workflow contracts
        run: |
          set -euo pipefail
          python3 -m venv .ci-validate-env
          .ci-validate-env/bin/pip install --quiet pyyaml pillow
          .ci-validate-env/bin/python ios/scripts/validate.py
          python3 android/scripts/validate.py
      - name: Run deploy & installer tests
        env:
          MUSEBOT_PYTHON: ${{ github.workspace }}/.ci-validate-env/bin/python
        run: node --test deploy/tests/*.test.js
      - name: Clean up validation venv
        if: always()
        run: rm -rf .ci-validate-env

  companion-and-bundle:
    name: Companion tests & release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0, node24
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://astral.sh/uv/0.11.8/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, node24
        with:
          path: ~/.cache/uv
          key: uv-linux-${{ hashFiles('tools/fetch-hermes.sh') }}
          restore-keys: |
            uv-linux-
      - name: Fetch Hermes & prepare Python environment
        run: |
          set -euo pipefail
          bash tools/fetch-hermes.sh
          (cd hermes && UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/hermes-env" uv sync --frozen --no-dev --python 3.14 \
            --extra mcp --extra web --extra ddgs --extra doc-extract --extra computer-use --extra anthropic)
          uv pip install --python "$GITHUB_WORKSPACE/hermes-env/bin/python" py-vapid==1.9.6 http-ece==1.2.1
      - name: Run companion unit tests
        working-directory: companion/tests
        run: |
          "$GITHUB_WORKSPACE/hermes-env/bin/python" -B -m unittest discover -s . -p "test_*.py"
      - name: Smoke-test server release bundle
        run: |
          set -euo pipefail
          (cd web && npm ci && npm run build)
          MUSEBOT_VERSION=ci-smoke bash deploy/vps/pack.sh
          node deploy/npm/bin/musebot.js check-bundle deploy/dist/musebot-server-ci-smoke.tar.gz
