name: Release

# Push a version tag (git tag v1.2.0 && git push origin v1.2.0) and this runs the server/web/deploy
# test suites, builds the server bundle (Hermes at its pinned version + the companion plugin + the
# built web app + install.sh + LICENSE/NOTICE), verifies no secrets are inside, generates its SHA-256
# checksum, and publishes both to GitHub Releases. Servers pick it up with: sudo npx -y musebot-server update
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0, node24
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG (expected vX.Y.Z or vX.Y.Z-rc.1)" >&2
            exit 1
          fi
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://astral.sh/uv/0.11.8/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, node24
        with:
          path: ~/.cache/uv
          key: uv-linux-${{ hashFiles('tools/fetch-hermes.sh') }}
          restore-keys: |
            uv-linux-
      - name: Hermes Agent & companion test gate
        run: |
          set -euo pipefail
          bash tools/fetch-hermes.sh
          (cd hermes && UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/hermes-env" uv sync --frozen --no-dev --python 3.14 \
            --extra mcp --extra web --extra ddgs --extra doc-extract --extra computer-use --extra anthropic)
          uv pip install --python "$GITHUB_WORKSPACE/hermes-env/bin/python" py-vapid==1.9.6 http-ece==1.2.1
          (cd companion/tests && "$GITHUB_WORKSPACE/hermes-env/bin/python" -B -m unittest discover -s . -p "test_*.py")
          MUSEBOT_PYTHON="$GITHUB_WORKSPACE/hermes-env/bin/python" node --test deploy/tests/*.test.js
      - name: Lint, test, and build the web app
        working-directory: web
        run: npm ci && npm run lint && npm test && npm run build
      - name: Pack and verify bundle (no data, no keys)
        env:
          MUSEBOT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash deploy/vps/pack.sh
          mv "deploy/dist/musebot-server-$MUSEBOT_VERSION.tar.gz" musebot-server.tar.gz
          node deploy/npm/bin/musebot.js check-bundle musebot-server.tar.gz
          sha256sum musebot-server.tar.gz > musebot-server.tar.gz.sha256
          sha256sum -c musebot-server.tar.gz.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" musebot-server.tar.gz musebot-server.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" musebot-server.tar.gz musebot-server.tar.gz.sha256 \
              --title "Muse Bot $TAG" --generate-notes "${PRERELEASE_ARGS[@]}"
          fi
