[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "muse-bot"
version = "2.0.0.dev0"
description = "Muse Bot — self-hosted AI companion powered by the native async Muse runtime."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Web & async transport (6)
    "starlette>=0.46,<2",
    "uvicorn>=0.34,<1",
    "websockets>=14.0,<16",
    "python-multipart>=0.0.20,<1",
    "httpx[socks]>=0.28,<1",
    "truststore>=0.10",
    # Model SDKs, MCP protocol & validation (4)
    "openai>=1.68,<3",
    "anthropic>=0.49,<1",
    "mcp>=1.24,<3",
    "pydantic>=2.10,<3",
    # Config, crypto, scheduling & process control (6)
    "ruamel.yaml>=0.18.10",
    "python-dotenv>=1.0",
    "cryptography>=44.0",
    "croniter>=6.0",
    "psutil>=6.1",
    "tzdata>=2025.1; sys_platform == 'win32'",
    # Imaging, Web Push, web search & PDF extraction (6)
    "Pillow>=11.0",
    "pillow-heif>=0.21",
    "py-vapid>=1.9.6",
    "http-ece>=1.2.1",
    "ddgs>=8.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
tts = ["edge-tts>=7.0"]
office = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.scripts]
musebot = "muse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["muse", "companion"]
