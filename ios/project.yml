name: Companion
options:
  bundleIdPrefix: com.personalbot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    # Xcode's language-mode setting accepts 5.0/6.0, not a compiler release such as 5.9.
    # Xcode 26.3 supplies the newer compiler; Swift 5 mode keeps dependency diagnostics compatible.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: Companion
        excludes:
          - Info.plist
          - Resources
      - path: Companion/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalbot.companion
        PRODUCT_NAME: Companion
        INFOPLIST_FILE: Companion/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CompanionTests
        excludes:
          - Fixtures
      - path: CompanionTests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalbot.companion.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Companion
  CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CompanionUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalbot.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Companion
    dependencies:
      - target: Companion
schemes:
  # Screenshots of every screen against preview/mock_server.py (the workflow's screenshot job).
  Screenshots:
    build:
      targets:
        Companion: all
        CompanionUITests: [test]
    test:
      config: Debug
      targets:
        - CompanionUITests
  Companion:
    build:
      targets:
        Companion: all
        CompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CompanionTests
    archive:
      config: Release
