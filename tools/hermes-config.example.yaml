# Muse Bot: the starting Hermes config. tools/setup.sh copies it to $HERMES_HOME/config.yaml once
# (an existing config is never overwritten).
#
# No API keys here: add your models in the app (设置 → 模型 → 添加模型), which keeps the keys in
# $HERMES_HOME/.env. Services (browser, email, calendar, maps…) are connected in 设置 → 已连接的服务.

plugins:
  enabled:
    - companion-platform   # the Muse Bot plugin (companion/), linked into $HERMES_HOME/plugins
  disabled: []

# Replies stream into the app as they are written.
streaming:
  enabled: true
  cursor: ""

display:
  language: zh             # the companion's notices (restarts, interrupted tasks) in Chinese
  file_mutation_verifier: false

agent:
  max_turns: 100

# Scheduled tasks follow the phone's timezone once a phone connects.
timezone: Asia/Shanghai

cron:
  wrap_response: false

# Behind a local proxy that answers DNS with fake IPs (Clash/Surge "fake-ip" mode), let the web
# tools reach them:
# security:
#   fake_ip_ranges:
#     - 198.18.0.0/15
