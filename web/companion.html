<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=auto" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f8f3ef"
      data-theme-color-light="#f8f3ef"
      data-theme-color-dark="#120d0a"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Muse Bot" />
    <link rel="icon" type="image/svg+xml" href="/brand/companion_mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/companion_apple_touch.png" />
    <link rel="manifest" href="/companion-manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }
      body {
        margin: 0;
        background: #f8f3ef;
        color: #111114;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }
      html.dark body {
        background: #120d0a;
        color: #f2f2f5;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("nanobot-webui.theme");
          } catch {}
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            var color = themeColor.getAttribute(
              dark ? "data-theme-color-dark" : "data-theme-color-light"
            );
            if (color) themeColor.setAttribute("content", color);
          }
        } catch {}
      })();
    </script>
    <title>Muse Bot</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/companion/main.tsx"></script>
  </body>
</html>
